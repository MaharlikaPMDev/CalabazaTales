[package]
name = "calabaza-tales"
version = "0.1.5"
edition = "2024"
license = "MIT"
description = "A fast, configurable MMORPG foundation for PumpkinMC"
repository = "https://github.com/MaharlikaPMDev/CalabazaTales"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "37437ee0a013f3d8a776227516be151f5a490b4c", package = "pumpkin-plugin-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
